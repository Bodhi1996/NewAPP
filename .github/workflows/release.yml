name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish application
        run: dotnet publish NewAPP.csproj -c Release -r win-x64 --self-contained -o ./publish

      - name: Install Velopack
        run: dotnet tool install -g vpk

      - name: Download previous release
        run: vpk download github --repoUrl https://github.com/${{ github.repository }}

      - name: Create Velopack release
        run: vpk pack -u NewAPP -v ${GITHUB_REF_NAME#v} -p ./publish --mainExe NewAPP.exe

      - name: Upload to GitHub Release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "v${GITHUB_REF_NAME#v}"
