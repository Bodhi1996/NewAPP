name: Release and Update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
      - name: Клонируем код
        uses: actions/checkout@v4

      - name: Устанавливаем .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Публикуем приложение
        run: dotnet publish NewAPP.csproj -c Release -r win-x64 --self-contained -o ./publish

      - name: Устанавливаем vpk и создаём релиз
        run: |
          dotnet tool install -g vpk
          vpk download github --repoUrl https://github.com/${{ github.repository }}
          vpk pack -u NewAPP -v ${GITHUB_REF_NAME#v} -p ./publish --mainExe NewAPP.exe
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "v${GITHUB_REF_NAME#v}"
